[workspace]
members = ["apps/*", "crates/*", "web/*"]
default-members = ["apps/outcome-hub"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
outcome_hub_cli = { package = "outcome-hub-cli", path = "apps/cli" }
outcome_hub_console = { package = "outcome-hub-console", path = "apps/console" }
software_delivery = { package = "outcome-hub-software-delivery", path = "crates/software-delivery" }
software_verification = { package = "outcome-hub-software-verification", path = "crates/software-verification" }
executor_service = { package = "outcome-hub-executor-service", path = "crates/executor-service" }
sandbox_service = { package = "outcome-hub-sandbox-service", path = "crates/sandbox-service" }
outcome_service = { package = "outcome-hub-outcome-service", path = "crates/outcome-service" }
codex_adapter = { package = "outcome-hub-codex-adapter", path = "crates/codex-adapter" }
collaboration_host = { package = "outcome-hub-collaboration-host", path = "crates/collaboration-host" }
collaboration_client = { package = "outcome-hub-collaboration-client", path = "crates/collaboration-client" }
service_registry = { package = "outcome-hub-service-registry", path = "crates/service-registry" }
collaboration_model = { package = "outcome-hub-collaboration-model", path = "crates/collaboration-model" }
service_workers = { package = "outcome-hub-service-workers", path = "crates/service-workers" }
service_api = { package = "outcome-hub-service-api", path = "crates/service-api" }
collaboration_storage_service = { package = "outcome-hub-collaboration-storage-service", path = "crates/collaboration-storage-service" }
service_protocol = { package = "outcome-hub-service-protocol", path = "crates/service-protocol" }
anyhow = "1"
async-stream = "0.3"
axum = "0.8.9"
futures-util = "0.3"
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
tempfile = "3"
agent_backend = { package = "outcome-hub-agent-backend", path = "crates/agent-backend" }
agent_policy = { package = "outcome-hub-agent-policy", path = "crates/agent-policy" }
automation = { package = "outcome-hub-delivery-outbox", path = "crates/delivery-outbox" }
budget = { package = "outcome-hub-execution-budget", path = "crates/execution-budget" }
build_cache = { package = "outcome-hub-build-cache", path = "crates/build-cache" }
collaboration_experiment = { package = "outcome-hub-collaboration-evaluation", path = "crates/collaboration-evaluation" }
web_assets = { package = "outcome-hub-web-assets", path = "web/shared" }
collaboration_api = { package = "outcome-hub-collaboration-api", path = "crates/collaboration-api" }
contracts = { package = "outcome-hub-contracts", path = "crates/contracts" }
collaboration_store = { package = "outcome-hub-collaboration-store", path = "crates/collaboration-store" }
communication = { package = "outcome-hub-collaboration-proposals", path = "crates/collaboration-proposals" }
config = { package = "outcome-hub-execution-config", path = "crates/execution-config" }
delivery = { package = "outcome-hub-delivery-adapters", path = "crates/delivery-adapters" }
evolution = { package = "outcome-hub-prompt-evolution", path = "crates/prompt-evolution" }
evolution_cli = { package = "outcome-hub-prompt-evolution-cli", path = "crates/prompt-evolution-cli" }
freshness = { package = "outcome-hub-source-freshness", path = "crates/source-freshness" }
inputs = { package = "outcome-hub-execution-inputs", path = "crates/execution-inputs" }
isolation = { package = "outcome-hub-isolation", path = "crates/isolation" }
knowledge = { package = "outcome-hub-knowledge-publication", path = "crates/knowledge-publication" }
lease_heartbeat = { package = "outcome-hub-lease-heartbeat", path = "crates/lease-heartbeat" }
multi_agent = { package = "outcome-hub-agent-teams", path = "crates/agent-teams" }
native_effects = { package = "outcome-hub-native-effects", path = "crates/native-effects" }
process = { package = "outcome-hub-process", path = "crates/process" }
runtime = { package = "outcome-hub-execution-runtime", path = "crates/execution-runtime" }
storage = { package = "outcome-hub-filesystem-store", path = "crates/filesystem-store" }
targets = { package = "outcome-hub-execution-targets", path = "crates/execution-targets" }
task = { package = "outcome-hub-execution-model", path = "crates/execution-model" }
workflow = { package = "outcome-hub-workflow-adapter", path = "crates/workflow-adapter" }

outcome_hub_web = { package = "outcome-hub-web", path = "web/outcome-hub" }

console_web = { package = "outcome-hub-console-web", path = "web/console" }

knowledge_model = { package = "outcome-hub-knowledge-model", path = "crates/knowledge-model" }

knowledge_client = { package = "outcome-hub-knowledge-client", path = "crates/knowledge-client" }

knowledge_git = { package = "outcome-hub-knowledge-git", path = "crates/knowledge-git" }

knowledge_directory = { package = "outcome-hub-knowledge-directory", path = "crates/knowledge-directory" }

knowledge_service = { package = "outcome-hub-knowledge-service", path = "crates/knowledge-service" }
