[workspace]
members = ["app", "apps/*", "crates/*", "web/shared"]
default-members = ["apps/ai-im"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
research_cli = { package = "lab-research-cli", path = "apps/research-cli" }
research_console = { package = "lab-research-console", path = "apps/research-console" }
software_delivery = { package = "lab-software-delivery", path = "crates/software-delivery" }
software_verification = { package = "lab-software-verification", path = "crates/software-verification" }
executor_service = { package = "ai-im-executor-service", path = "crates/executor-service" }
sandbox_service = { package = "ai-im-sandbox-service", path = "crates/sandbox-service" }
outcome_service = { package = "ai-im-outcome-service", path = "crates/outcome-service" }
codex_adapter = { package = "ai-im-codex-adapter", path = "crates/codex-adapter" }
im_host = { package = "ai-im-host", path = "crates/im-host" }
im_client = { package = "ai-im-client", path = "crates/im-client" }
service_registry = { package = "ai-im-service-registry", path = "crates/service-registry" }
collaboration_model = { package = "ai-im-collaboration-model", path = "crates/collaboration-model" }
service_workers = { package = "ai-im-service-workers", path = "crates/service-workers" }
service_api = { package = "ai-im-service-api", path = "crates/service-api" }
im_storage = { package = "ai-im-storage", path = "crates/im-storage" }
service_protocol = { package = "ai-im-service-protocol", path = "crates/service-protocol" }
anyhow = "1"
async-stream = "0.3"
axum = "0.8.9"
futures-util = "0.3"
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
tempfile = "3"
agent_backend = { package = "lab-agent-backend", path = "crates/agent-backend" }
agent_policy = { package = "lab-agent-policy", path = "crates/agent-policy" }
automation = { package = "lab-automation", path = "crates/automation" }
budget = { package = "lab-budget", path = "crates/budget" }
build_cache = { package = "lab-build-cache", path = "crates/build-cache" }
collaboration_experiment = { package = "lab-collaboration-experiment", path = "crates/collaboration-experiment" }
web_assets = { package = "ai-im-web-assets", path = "web/shared" }
im_service = { package = "ai-im", path = "crates/im-service" }
contracts = { package = "lab-contracts", path = "crates/contracts" }
crystal = { package = "lab-crystal", path = "crates/crystal" }
communication = { package = "lab-communication", path = "crates/communication" }
config = { package = "lab-config", path = "crates/config" }
delivery = { package = "lab-delivery", path = "crates/delivery" }
evolution = { package = "lab-evolution", path = "crates/evolution" }
evolution_cli = { package = "lab-evolution-cli", path = "crates/evolution-cli" }
freshness = { package = "lab-freshness", path = "crates/freshness" }
inputs = { package = "lab-inputs", path = "crates/inputs" }
isolation = { package = "lab-isolation", path = "crates/isolation" }
knowledge = { package = "lab-knowledge", path = "crates/knowledge" }
lease_heartbeat = { package = "lab-lease-heartbeat", path = "crates/lease-heartbeat" }
multi_agent = { package = "lab-multi-agent", path = "crates/multi-agent" }
native_effects = { package = "lab-native-effects", path = "crates/native-effects" }
process = { package = "lab-process", path = "crates/process" }
runtime = { package = "lab-runtime", path = "crates/runtime" }
storage = { package = "lab-storage", path = "crates/storage" }
targets = { package = "lab-targets", path = "crates/targets" }
task = { package = "lab-task", path = "crates/task" }
workflow = { package = "lab-workflow", path = "crates/workflow" }
