name: Windows native
on:
  push:
    branches: [main, feature/windows-deployment-20261019]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Check native core
        run: cargo check --locked -p outcome-hub
      - name: Test native storage and protocol boundaries
        run: cargo test --locked -p outcome-hub-filesystem-store -p outcome-hub-service-protocol
      - name: Build and smoke-test native core
        shell: pwsh
        run: |
          cargo build --locked -p outcome-hub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./verification/windows-core-smoke.ps1
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ github.workflow }}
      - name: Build native core with Bazel
        run: bazel build --lockfile_mode=error //:outcome-hub
