schema_version: 1
languages: [rust]
rulesets: [core]
custom_rules: qualitygate/rules
rules:
  rust-no-chinese:
    enabled: true
    required: true
    severity: error
  line-ending:
    enabled: true
    required: true
    severity: error
source_reviews:
  rust-no-chinese:
    id: "rust-no-chinese-initial-mapping-20261011"
    reviewer: "Codex source-mapping review (local candidate)"
    reference: "qualitygate/reviews/rust-no-chinese.md"
    resolution: "initial_mapping"
    rationale: "Reviewed the complete AGENTS.md API and presentation boundaries section and the selected file rule. The Han regex enforces only the explicit Rust source character prohibition; locale, Unicode preservation and architectural semantics remain covered by separate tests and review. This is an agent-authored local source review, not independent approval."
    binding_digest: "sha256:d51395df7d386d9121cc9bd4301f2344cdf92184a52ac80059e18e0fea4ff024"
checks:
  - id: format
    kind: command
    argv: [cargo, fmt, --all, --, --check]
    timeout_seconds: 120
  - id: clippy
    kind: command
    argv: [cargo, clippy, --locked, --workspace, --all-targets, --, -D, warnings]
    timeout_seconds: 600
  - id: bazel-build
    kind: command
    argv: [bazel, build, "--lockfile_mode=error", "//:agent-research-lab", "//:package"]
    timeout_seconds: 900
  - id: bazel-test
    kind: command
    argv: [bazel, test, "--lockfile_mode=error", "//..."]
    depends_on: [bazel-build]
    timeout_seconds: 900
profiles:
  quick:
    include: [line-ending, format]
  full:
    include: [line-ending, rust-no-chinese, format, clippy, bazel-build, bazel-test]
verification_assets:
  - AGENTS.md
  - qualitygate/rules/**
  - web/**
  - qualitygate.yaml
  - Cargo.toml
  - Cargo.lock
  - MODULE.bazel
  - MODULE.bazel.lock
  - BUILD.bazel
  - app/**
  - crates/**
  - "**/*.bzl"
  - rust-toolchain.toml
  - .bazelrc
  - .bazelignore
  - .bazelversion
  - .github/workflows/**
  - prompts/**
  - research/**
  - skills/**
  - assets/**
