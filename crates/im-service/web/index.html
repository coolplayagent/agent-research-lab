<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="application-name" content="AI-IM" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title data-i18n="html.272791a0a2"></title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/assets/bootstrap.js"></script>
  </head>
  <body>
    <section id="login" class="login">
      <div class="orb">◈</div>
      <h1 data-i18n="html.272791a0a2"></h1>
      <p data-i18n="html.05b5df8a25"></p>
      <form id="login-form">
        <label
          ><span data-i18n="html.be58521719"></span
          ><input
            id="login-token"
            type="password"
            autocomplete="off"
            required="" /></label
        ><button data-i18n="html.736d069565"></button>
      </form>
      <p>
        <span data-i18n="html.86e58d9517"></span
        ><code data-i18n="html.b5143f9ac0"></code>
      </p>
      <p id="login-status" role="status"></p>
    </section>
    <div id="workspace" hidden="">
      <aside id="left-sidebar" class="sidebar">
        <div id="workspace-navigation">
          <a class="brand" href="#groups"
            ><span class="orb small">◈</span
            ><span data-i18n="workspace.brand"></span
          ></a>
          <div class="directory-title">
            <span data-i18n="workspace.conversations"></span
            ><button id="new-conversation" data-i18n="workspace.new"></button>
          </div>
          <div class="directory">
            <div class="directory-heading">
              <input
                id="group-search" type="search"
                aria-label=""
                placeholder=""
                data-i18n-placeholder="html.555f4a4f56"
                data-i18n-aria-label="html.555f4a4f56"
              /><button id="search-groups" data-i18n="html.3003318e72"></button>
            </div>
            <p id="directory-count" class="directory-count" role="status"></p>
            <div id="group-list"></div>
            <button
              id="more-groups"
              hidden=""
              data-i18n="html.af90a08fec"
            ></button>
          </div>
          <nav class="workspace-links" data-i18n-aria-label="html.9bae680405">
            <a
              href="#topics"
              data-page="topics"
            ><span id="topic-nav-icon" class="nav-icon"></span><span data-i18n="research.topics"></span></a>
            <a
              href="#people"
              data-page="people"
            ><span id="people-nav-icon" class="nav-icon"></span><span data-i18n="workspace.people"></span></a>
            <a
              href="#applications"
              data-page="applications"
            ><span id="applications-nav-icon" class="nav-icon"></span><span data-i18n="html.751b3aed56"></span></a>
          </nav>
          <div class="sidebar-footer">
            <span id="connection" data-i18n="html.694186911a"></span
            ><a href="#settings/services" data-i18n="html.638daed1c4"></a>
          </div>
        </div>
        <div id="settings-navigation" hidden>
          <a
            id="return-workspace"
            href="#groups"
            data-i18n="workspace.back"
          ></a>
          <h2 data-i18n="html.638daed1c4"></h2>
          <nav data-i18n-aria-label="workspace.settingsNav">
            <a
              href="#settings/services"
              data-setting="services"
              data-i18n="workspace.services"
            ></a>
            <a
              href="#settings/adapters"
              data-setting="adapters"
              data-i18n="workspace.adapters"
            ></a>
            <a
              href="#settings/bindings"
              data-setting="bindings"
              data-i18n="workspace.bindings"
            ></a>
            <a
              href="#settings/storage"
              data-setting="storage"
              data-i18n="workspace.storage"
            ></a>
            <a
              href="#settings/status"
              data-setting="status"
              data-i18n="workspace.status"
            ></a>
          </nav>
          <button id="logout" data-i18n="html.7c47dff731"></button>
        </div>
        <div
          id="resize-left"
          class="resizer"
          role="separator"
          tabindex="0"
          aria-orientation="vertical"
          data-i18n-aria-label="workspace.resizeLeft"
        ></div>
      </aside>
      <main>
        <header class="topbar">
          <div>
            <button
              id="toggle-directory"
              data-i18n="workspace.conversations"
              aria-controls="left-sidebar"
              aria-expanded="true"
            ></button>
            <h1 id="page-title" data-i18n="html.f3f8bcf3f5"></h1>
          </div>
          <div class="notice-wrap"><span id="notice" role="status"></span><button id="dismiss-notice" type="button" hidden data-i18n-aria-label="ux.dismiss">×</button></div
          ><button
            id="toggle-research"
            data-i18n="workspace.research"
            aria-controls="research-panel"
            aria-expanded="true"
          ></button>
        </header>
        <section id="conversations" class="conversation-layout">
          <div class="conversation">
            <div id="empty-conversation" class="empty">
              <div class="orb">◈</div>
              <h2 data-i18n="html.c011d8bd8e"></h2>
              <p data-i18n="html.6882cf173d"></p>
            </div>
            <div id="active-conversation" hidden="">
              <header class="conversation-heading">
                <div>
                  <h2 id="group-title"></h2>
                  <p id="group-topic"></p>
                  <small id="group-summary"></small>
                </div>
                <details class="group-menu">
                  <summary data-i18n="workspace.more"></summary>
                  <div class="actions">
                    <button
                      id="manage-members"
                      data-i18n="html.6e6d6ddbb7"
                    ></button
                    ><button
                      id="edit-group"
                      data-i18n="html.0518365699"
                    ></button
                    ><button id="pin-group" data-i18n="html.173f88d28e"></button
                    ><button
                      id="archive-group"
                      data-i18n="html.5292ab1a36"
                    ></button
                    ><button
                      id="convert-group"
                      hidden=""
                      data-i18n="html.e514f49ff0"
                    ></button>
                  </div>
                </details>
              </header>
              <button
                id="goal-summary"
                class="goal-summary"
                data-i18n="workspace.goalSummary"
              ></button>

              <div class="history-nav">
                <button id="older-messages" data-i18n="html.65b607bf71"></button
                ><button
                  id="latest-messages"
                  aria-live="polite"
                  data-i18n="html.1c59875d3a"
                ></button
                ><span id="history-status"></span>
              </div>
              <div
                id="messages"
                class="messages"
                role="log"
                aria-label=""
                aria-live="polite"
                data-i18n-aria-label="html.5e7ce1f7e5"
              ></div>
              <form id="composer">
                <div id="mention-menu" class="mention-menu" role="listbox" data-i18n-aria-label="mentions.choose" hidden=""></div>
                <label
                  for="message-text"
                  id="composer-label"
                  data-i18n="html.008814832c"
                ></label
                ><textarea
                  id="message-text"
                  rows="2"
                  maxlength="4096"
                  required=""
                  placeholder=""
                  data-i18n-placeholder="html.09f02f8e33"
                ></textarea>
                <div class="compose-actions">
                  <small id="message-count"></small>
                  <small data-i18n="mentions.hint"></small>
                  <span id="reply-status"></span
                  ><button
                    id="cancel-reply"
                    type="button"
                    hidden=""
                    data-i18n="html.d346633d3a"
                  ></button
                  ><button
                    id="send-message"
                    class="primary"
                    data-i18n="html.edecf0ae6e"
                  ></button>
                </div>
              </form>
            </div>
          </div>
        </section>
        <section id="people-page" class="content-page" hidden="">
          <header>
            <div>
              <h2 data-i18n="html.47ca7ee1c5"></h2>
              <p data-i18n="workspace.peopleNote"></p>
            </div>
            <button
              id="new-person"
              class="primary"
              data-i18n="html.44b0afcc76"
            ></button>
          </header>
          <div class="search-row">
            <input
              id="people-search"
              placeholder=""
              aria-label=""
              data-i18n-placeholder="html.c8f899ae2f"
              data-i18n-aria-label="html.302a4388ce"
            /><button id="search-people" data-i18n="html.3003318e72"></button>
          </div>
          <div id="people-list" class="cards"></div>
          <button
            id="more-people"
            hidden=""
            data-i18n="html.435e8f4a1f"
          ></button>
        </section>
        <section id="applications-page" class="content-page" hidden="">
          <h2 data-i18n="html.28f6b6e645"></h2>
          <p data-i18n="html.6771a427f6"></p>
          <div id="application-list" class="cards"></div>
        </section>
        <section id="topics-page" class="content-page" hidden>
          <div class="toolbar">
            <h2 data-i18n="research.topics"></h2>
            <button
              id="new-topic"
              class="primary"
              data-i18n="research.newTopic"
            ></button>
          </div>
          <p data-i18n="research.topicsNote"></p>
          <div class="toolbar">
            <input
              id="topic-search"
              data-i18n-placeholder="research.search"
              data-i18n-aria-label="research.search"
            /><button
              id="topic-search-button"
              data-i18n="research.search"
            ></button>
          </div>
          <div id="topic-list" class="cards"></div>
          <button id="more-topics" hidden data-i18n="research.more"></button>
          <section id="topic-detail" hidden class="research-detail">
            <h3 id="topic-detail-title"></h3>
            <p id="topic-detail-objective"></p>
            <div class="toolbar">
              <button
                id="topic-open-group"
                data-i18n="research.openGroup"
              ></button
              ><button id="topic-open-graph" data-i18n="research.graph"></button
              ><button
                id="new-subject"
                data-i18n="research.newSubject"
              ></button>
            </div>
            <div id="subject-list" class="cards"></div>
            <button
              id="more-subjects"
              hidden
              data-i18n="research.more"
            ></button>
          </section>
        </section>

        <section id="settings-page" class="content-page" hidden>
          <p id="services-status" role="status"></p>
          <section data-settings-panel="services">
            <header>
              <h2 data-i18n="workspace.services"></h2>
              <div class="toolbar">
                <button
                  id="refresh-services"
                  data-i18n="services.refresh"
                ></button
                ><button
                  id="add-service"
                  data-i18n="services.addService"
                ></button>
              </div>
            </header>
            <div id="service-list" class="cards"></div>
          </section>
          <section data-settings-panel="adapters" hidden>
            <header>
              <h2 data-i18n="workspace.adapters"></h2>
              <button id="add-adapter" data-i18n="services.addAdapter"></button>
            </header>
            <p data-i18n="services.adapterNote"></p>
            <div id="adapter-list" class="cards"></div>
          </section>
          <section data-settings-panel="bindings" hidden>
            <h2 data-i18n="workspace.bindings"></h2>
            <div id="binding-list"></div>
          </section>
          <section data-settings-panel="storage" hidden>
            <h2 data-i18n="workspace.storage"></h2>
            <div id="storage-selection"></div>
          </section>
          <section data-settings-panel="status" hidden>
            <h2 data-i18n="workspace.status"></h2>
            <dl id="metrics" class="metrics"></dl>
          </section>
        </section>
      </main>
      <aside id="research-panel" aria-labelledby="research-title">
        <div
          id="resize-right"
          class="resizer"
          role="separator"
          tabindex="0"
          aria-orientation="vertical"
          data-i18n-aria-label="workspace.resizeRight"
        ></div>
        <header class="research-heading">
          <h2 id="research-title" data-i18n="workspace.research"></h2>
          <button
            id="expand-research"
            data-i18n="workspace.expand"
            aria-pressed="false"
          ></button
          ><button id="close-research" data-i18n="workspace.collapse"></button>
        </header>
        <div
          id="research-tabs"
          role="tablist"
          data-i18n-aria-label="workspace.research"
        >
          <button
            id="tab-collaboration"
            role="tab"
            aria-controls="collaboration-page"
            data-tab="collaboration"
            data-i18n="workspace.crystal"
          ></button>
          <button
            id="tab-evolution"
            role="tab"
            aria-controls="evolution-page"
            data-tab="evolution"
            data-i18n="workspace.evolution"
          ></button>
          <button
            id="tab-goals"
            role="tab"
            aria-controls="goals-page"
            data-tab="goals"
            data-i18n="workspace.goals"
          ></button>
          <button
            id="tab-members"
            role="tab"
            aria-controls="members-page"
            data-tab="members"
            data-i18n="workspace.members"
          ></button>
        </div>
        <div class="research-body">
          <section id="collaboration-page" class="research-tab">
            <p id="collaboration-status" role="status"></p>
            <div id="collaboration-graph"></div>
            <p class="graph-legend" data-i18n="workspace.graphLegend"></p>
            <div class="toolbar">
              <button
                id="refresh-collaboration"
                data-i18n="research.refresh"
              ></button
              ><button
                id="more-collaboration"
                hidden
                data-i18n="html.ae4ed171f5"
              ></button>
            </div>
            <div id="collaboration-detail"></div>
          </section>
          <section id="evolution-page" class="research-tab" hidden>
            <div class="toolbar">
              <h2 data-i18n="research.graph"></h2>
              <button
                id="new-evolution-node"
                class="primary"
                disabled
                data-i18n="research.newNode"
              ></button>
            </div>
            <p data-i18n="research.graphNote"></p>
            <div id="evolution-filters" class="toolbar"></div>
            <div class="toolbar">
              <button
                id="refresh-evolution"
                data-i18n="research.refresh"
              ></button
              ><button
                id="evolution-zoom-out"
                data-i18n="research.zoomOut"
              ></button
              ><button
                id="evolution-zoom-in"
                data-i18n="research.zoomIn"
              ></button>
            </div>
            <p id="evolution-summary"></p>
            <div class="evolution-layout">
              <div id="evolution-canvas" class="graph-viewport"></div>
              <aside
                id="evolution-detail"
                class="research-detail"
                hidden
              ></aside>
            </div>
            <button
              id="more-evolution"
              hidden
              data-i18n="research.more"
            ></button>
          </section>
          <section id="goals-page" class="research-tab" hidden>
            <section id="goal-section" class="goal-section">
              <header>
                <h3 data-i18n="html.769481704b"></h3>
                <button
                  id="new-goal"
                  class="primary"
                  data-i18n="html.ead1d713cf"
                ></button>
              </header>
              <div id="goal-list"></div>
              <button
                id="more-goals"
                hidden=""
                data-i18n="html.29ddbd408f"
              ></button>
            </section>
          </section>
          <section id="members-page" class="research-tab" hidden>
            <div id="research-members"></div>
            <button
              id="research-manage-members"
              data-i18n="html.6e6d6ddbb7"
            ></button>
          </section>
        </div>
      </aside>
    </div>
    <dialog id="goal-dialog">
      <form id="goal-form">
        <header>
          <h2 data-i18n="html.6aac0bd96a"></h2>
          <button
            type="button"
            data-close="goal-dialog"
            data-i18n="html.3fd47edce4"
          ></button>
        </header>
        <p id="goal-group-name"></p>
        <label
          ><span data-i18n="html.cb9877f3a9"></span
          ><input id="goal-title" required="" maxlength="80"
        /></label>
        <label
          ><span data-i18n="html.f617beed33"></span
          ><textarea
            id="goal-objective"
            required=""
            rows="3"
            maxlength="5000"
          ></textarea>
        </label>
        <label
          ><span data-i18n="html.df431cfed9"></span
          ><textarea
            id="goal-acceptance"
            required=""
            rows="2"
            maxlength="2500"
          ></textarea>
        </label>
        <label
          ><span data-i18n="html.28f6b6e645"></span
          ><select id="goal-scenario"></select
        ></label>
        <p id="goal-scenario-note"></p>
        <div id="goal-parameters"></div>
        <label
          ><span data-i18n="html.f1c2b705ed"></span
          ><input
            id="goal-limit"
            type="number"
            min="30"
            max="43200"
            value="3600"
            required=""
        /></label>
        <h3 data-i18n="html.2f4dd5a491"></h3>
        <p data-i18n="html.dbeae948bb"></p>
        <div id="goal-assignees"></div>
        <button
          id="more-goal-members"
          type="button"
          hidden=""
          data-i18n="html.4013d4a77c"
        ></button>
        <p id="goal-status" role="status"></p>
        <button
          id="goal-submit"
          class="primary"
          data-i18n="html.6e5dd5cdce"
        ></button>
      </form>
    </dialog>
    <dialog id="group-dialog">
      <form id="group-form">
        <header>
          <h2 data-i18n="html.e67d010eb1"></h2>
          <button
            type="button"
            data-close="group-dialog"
            data-i18n="html.3fd47edce4"
          ></button>
        </header>
        <label
          ><span data-i18n="html.45a41c67e5"></span
          ><select id="group-kind">
            <option value="conversation" data-i18n="html.ff40f5a38d"></option>
            <option value="temporary" data-i18n="html.3ceac95dcf"></option>
            <option
              value="board"
              data-i18n="html.ca4773c5ff"
            ></option></select></label
        ><label id="group-name-label"
          ><span data-i18n="html.d44e9b3d3b"></span
          ><input id="group-name" maxlength="100" required="" /></label
        ><label
          ><span data-i18n="html.788db1cfec"></span
          ><textarea id="group-description" maxlength="600" rows="2"></textarea>
        </label>
        <p id="group-kind-note"></p>
        <div id="create-picker"></div>
        <p id="create-status" role="status"></p>
        <button
          class="primary"
          id="create-submit"
          data-i18n="html.795e7905dc"
        ></button>
      </form>
    </dialog>
    <dialog id="members-dialog">
      <header>
        <h2 data-i18n="html.22bc9f158f"></h2>
        <button
          data-close="members-dialog"
          data-i18n="html.3fd47edce4"
        ></button>
      </header>
      <div id="member-list"></div>
      <button id="more-members" hidden="" data-i18n="html.ae4ed171f5"></button>
      <hr />
      <h3 id="add-members-title" data-i18n="html.ad9737dafd"></h3>
      <div id="member-picker"></div>
      <label id="history-choice" hidden=""
        ><select id="include-history">
          <option value="none" data-i18n="html.8f7fc05480"></option>
          <option value="all" data-i18n="html.4d592ae065"></option></select
      ></label>
      <p id="member-status" role="status"></p>
      <button
        id="add-members"
        class="primary"
        data-i18n="html.cf5428904b"
      ></button>
    </dialog>
    <dialog id="person-dialog">
      <form id="person-form">
        <header>
          <h2 data-i18n="html.a29c23de8c"></h2>
          <button
            type="button"
            data-close="person-dialog"
            data-i18n="html.3fd47edce4"
          ></button>
        </header>
        <label
          ><span data-i18n="html.a98585871c"></span
          ><input
            id="person-name"
            required=""
            maxlength="80"
            placeholder=""
            data-i18n-placeholder="html.27c00694ec"
        /></label>
        <p id="person-status" role="status"></p>
        <button class="primary" data-i18n="html.a3030bf8f1"></button>
      </form>
    </dialog>

    <dialog id="edit-dialog">
      <form id="edit-form">
        <header>
          <h2 id="edit-title" data-i18n="html.62812613e5"></h2>
          <button
            type="button"
            data-close="edit-dialog"
            data-i18n="html.3fd47edce4"
          ></button>
        </header>
        <label
          ><span data-i18n="html.d44e9b3d3b"></span
          ><input id="edit-name" required="" maxlength="100" /></label
        ><label
          ><span data-i18n="html.788db1cfec"></span
          ><textarea id="edit-topic" required="" maxlength="600"></textarea>
        </label>
        <p id="edit-note"></p>
        <p id="edit-status" role="status"></p>
        <button class="primary" data-i18n="html.a3030bf8f1"></button>
      </form>
    </dialog>
  </body>
</html>
