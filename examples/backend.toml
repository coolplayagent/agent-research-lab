# Merge this fragment into a private local.toml; no credentials belong here.
# Existing [models] values are model identifiers passed to the selected backend.
[agent_backends.local-bot]
kind = "json_process"
program = "/opt/agent-bridges/local-bot-v1"
args = [] # literal nonsecret arguments; no shell expansion
# Optional names only. Secret values remain in the host environment.
env_allowlist = ["ANTHROPIC_API_KEY"]
[agent_backends.local-bot.capabilities]
structured_result = true
read_workspace = true
write_workspace = true
tool_execution = true
desktop = false

[role_backends]
research = "local-bot"
# Omitted roles retain the legacy Codex backend.
# implement = "local-bot"
# review = "codex"

# Optional model inventories are technical configuration, independent of people/roles.
# Omit a backend here to retain the existing [models] defaults for that executor.
# When present, include all role-default models routed to this backend as well.
# [backend_models]
# codex = ["your-research-model", "your-review-model", "your-implementation-model"]
# local-bot = ["your-local-model"]
# A person selects one configured backend/model pair in Settings → People → Execution.
