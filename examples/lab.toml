schema_version = 1
require_latest = true
skills_manifest = "/opt/workspace/agent-research-lab/.lab/latest/skills.json"
workspace = "/opt/workspace"
state_dir = "/opt/workspace/agent-research-lab/.lab"
superpod = "/opt/workspace/superpod"
codex = "codex"
workflow = "/home/tdp/.codex/skills/workflow-cli/assets/linux-x86_64/workflow"
daily_seconds = 43200
max_agents = 8
task_timeout_seconds = 1800

[models]
research = "gpt-6-astra"
implement = "gpt-6.1-sol"
review = "gpt-6-sol"

[tools.workflow-cli]
binary = "/home/tdp/.codex/skills/workflow-cli/assets/linux-x86_64/workflow"
repository = "/opt/workspace/workflow-cli"
probe = ["version", "--format", "json"]
[tools.relay-knowledge]
binary = "/home/tdp/.codex/skills/relay-knowledge-cli/assets/linux-x86_64/relay-knowledge"
repository = "/opt/workspace/relay-knowledge"
probe = ["version", "--format", "json"]
[tools.into-markdown]
binary = "/home/tdp/.codex/skills/into-markdown/assets/linux-x86_64/into-md"
repository = "/opt/workspace/into-markdown"
probe = ["--version"]
[tools.qualitygate-cli]
binary = "/home/tdp/.codex/skills/qualitygate-cli/assets/linux-x86_64/qualitygate"
repository = "/opt/workspace/qualitygate-cli"
probe = ["--version"]
[tools.computer-use-cli]
binary = "/home/tdp/.codex/skills/computer-use-cli/assets/linux-x86_64/relay-computer-use"
repository = "/opt/workspace/computer-use-cli"
